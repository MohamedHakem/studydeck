{path:"Cohesion basics › What cohesion is",tag:"Slides 2–4",t:"What is cohesion?",ge:"Cohesion is the set of semantic ties that make separate sentences hang together as one text. That feeling of unity is called texture.",g:"cohesion هو مجموعة الروابط الدلالية التي تجعل الجمل المنفصلة تتماسك كنص واحد، وهذا الإحساس بالوحدة اسمه texture.",
fig:()=>FG(0),after(){PL("pl",`flowchart LR
A["separate sentences"]:::sub -->|"cohesive ties (semantic relations)"| T["texture<br/>= a unified text"]:::built`)},
p:[
["Cohesion is a fundamental aspect of discourse analysis, serving as a linguistic mechanism that establishes connectedness within a text or sentence.","الـ cohesion جانب أساسي في discourse analysis، وهو آلية لغوية تُنشئ الترابط داخل النص أو الجملة."],
["It encompasses lexical, grammatical, and semantic ties that allow readers to link ideas meaningfully.","وهو يشمل روابط lexical وgrammatical وsemantic تتيح للقارئ ربط الأفكار بطريقة ذات معنى."],
["One key type is lexical cohesion, which focuses on how meaning is shaped by vocabulary choice.","ومن أهم أنواعه lexical cohesion الذي يركّز على كيفية تشكّل المعنى باختيار المفردات."],
["It plays a vital role in comprehension by facilitating connections through synonymy, antonymy, hyponymy, and collocation—features widely employed in both spoken and written communication.","ويؤدي دورًا حيويًا في الفهم بتسهيل الروابط عبر synonymy وantonymy وhyponymy وcollocation، وهي سمات تُستخدم كثيرًا في الكلام والكتابة."],
["Lexical cohesion is generally divided into reiteration and collocation, with reiteration including repetition, synonymy, hyponymy.","ينقسم lexical cohesion عادةً إلى reiteration وcollocation، ويشمل reiteration التكرار (repetition) وsynonymy وhyponymy."],
["Ultimately, lexical cohesion links words, phrases, and concepts throughout a text, thereby enhancing its clarity and coherence.","وفي النهاية يربط lexical cohesion الكلمات والعبارات والمفاهيم عبر النص، فيزيد وضوحه وcoherence."],
["Halliday and Hasan (1976) contend that the key factor determining whether a set of sentences forms a text lies in the cohesive relations that bind them together, thereby creating texture.","يرى Halliday وHasan (1976) أن العامل الحاسم في كون مجموعة جمل تشكّل نصًا هو العلاقات cohesive التي تربطها، فتُنتج texture."],
["Cohesion, in their definition, refers to the semantic relations within a text that give it unity.","والـ cohesion في تعريفهما هو العلاقات الدلالية (semantic) داخل النص التي تمنحه وحدته."],
["Halliday and Hasan (1976) introduced the concept of cohesion to explain the semantic relations between textual elements that allow a text to “hang together” as a unified whole.","قدّم Halliday وHasan (1976) مفهوم cohesion لشرح العلاقات الدلالية بين عناصر النص التي تجعله “يتماسك” كلًّا موحدًا."],
["These text-forming ties provide what they call texture (Halliday & Hasan, 1985; Martin, 2001).","وهذه الروابط المكوِّنة للنص تمنحه ما يسمّيانه texture (Halliday & Hasan, 1985; Martin, 2001)."],
["In the absence of such relations, texts often become unintelligible despite the reader’s or listener’s effort, whereas cohesive texts are typically perceived as clear, effective, and impactful (Eggins, 2004).","وبغياب هذه العلاقات كثيرًا ما يصبح النص غير مفهوم مهما بذل القارئ أو المستمع، بينما تُعدّ النصوص المتماسكة عادةً واضحة وفعّالة ومؤثرة (Eggins, 2004)."]]},
{path:"Cohesion basics › Two examples",tag:"Slides 5–6",t:"Cohesion at work",ge:"Two examples, two kinds of tie: them → six cooking apples is grammatical (Reference); boy–girl and wriggle–wriggle are lexical.",g:"مثالان ونوعان من الروابط: them → six cooking apples رابط grammatical (Reference)، وboy–girl وwriggle–wriggle رابطان lexical.",
fig:()=>FG(1),after(){PL("pl",L2MAP)},
p:[
["Based on this, Halliday and Hasan (1976) maintain that cohesion constitutes both a necessary and sufficient condition for textual unity.","وبناءً على ذلك يرى Halliday وHasan (1976) أن cohesion شرط ضروري وكافٍ معًا لوحدة النص."],
["To illustrate, they provide examples such as:","وللتوضيح يقدّمان أمثلة منها:"],
["Wash and core six cooking apples. Put them into a fireproof dish.","اغسل وانزع قلب ست تفاحات للطبخ. ضعها في طبق مقاوم للنار.",1],
["Example (1) illustrates how grammatical cohesion functions to connect sentences.","يوضح المثال (1) كيف يعمل grammatical cohesion على ربط الجمل."],
["In this case, the pronoun them in the second sentence refers back anaphorically to the nominal group six cooking apples in the first sentence.","هنا يشير الضمير them في الجملة الثانية إلى الخلف (anaphorically) نحو nominal group six cooking apples في الجملة الأولى."],
["The presupposition introduced by them is therefore resolved by its antecedent, six cooking apples.","فالافتراض المسبق (presupposition) الذي يحمله them يُحَلّ بسابقه (antecedent) six cooking apples."],
["Halliday and Hasan (1976) identify this type of cohesive relation as Reference.","ويسمّي Halliday وHasan (1976) هذا النوع من العلاقات cohesive باسم Reference."],
["In contrast, example (2) highlights the role of lexical cohesion.","وفي المقابل يبرز المثال (2) دور lexical cohesion."],
["Two cohesive ties can be identified: boy–girl and wriggle–wriggle.","ويمكن تحديد رابطتين cohesive: boy–girl وwriggle–wriggle."],
["The relation between boy and girl is one of antonymy, while the recurrence of wriggle represents repetition, a form of reiteration.","العلاقة بين boy وgirl هي antonymy، أما تكرار wriggle فيمثّل repetition وهو شكل من reiteration."],
["Together, these lexical ties create semantic links that strengthen the connection between the sentences.","وتخلق هذه الروابط lexical معًا روابط دلالية تقوّي الصلة بين الجمل."],
["Thus, both examples demonstrate cohesion, though achieved through different but complementary linguistic resources.","وهكذا يُظهر المثالان cohesion وإن تحقّق بموارد لغوية مختلفة لكنها متكاملة."]]},
{path:"Cohesion basics › The five devices",tag:"Slides 7–8",t:"The five cohesive devices",ge:"Halliday and Hasan’s (1976) model of cohesion has five devices: four grammatical (reference, substitution, ellipsis, conjunction) and one lexical.",g:"خمس أدوات في المجموع: أربع grammatical (reference وsubstitution وellipsis وconjunction) وواحدة lexical.",
fig:()=>FG(1),after(){PL("pl",L3MAP)},
p:[
["Halliday and Hasan (1976) identify five cohesive devices: reference, substitution, ellipsis, conjunction, and lexical cohesion.","يحدد Halliday وHasan (1976) خمس أدوات cohesive: reference وsubstitution وellipsis وconjunction وlexical cohesion."],
["The first four are grammatical, while the last is lexical.","الأربعة الأولى grammatical، أما الأخيرة فهي lexical."],
["Grammatical cohesion is created through grammatical structures that link different components of a text together.","ينشأ grammatical cohesion عبر بُنى نحوية تربط مكوّنات النص المختلفة معًا."],
["Halliday and Hasan (1976) classify grammatical cohesion into four major categories: reference, substitution, ellipsis, and conjunction.","ويصنّف Halliday وHasan (1976) الـ grammatical cohesion إلى أربع فئات رئيسية: reference وsubstitution وellipsis وconjunction."]]},
{path:"Cohesion basics › Lexical cohesion",tag:"Slide 9",t:"Lexical cohesion in detail",ge:"Lexical cohesion works through reiteration (full or partial repetition) and collocation.",g:"يعمل lexical cohesion عبر reiteration (تكرار كامل أو جزئي) وcollocation.",
fig:()=>FG(1),after(){PL("pl",L4MAP)},
p:[
["Lexical cohesion occurs when semantically related words appear across a text, thereby linking its parts more tightly in meaning.","يحدث lexical cohesion عندما تظهر كلمات مترابطة دلاليًا عبر النص فتربط أجزاءه بإحكام أكبر في المعنى."],
["Lexical cohesion can be achieved through reiteration and collocation.","ويمكن تحقيق lexical cohesion عبر reiteration وcollocation."],
["Reiteration is divided into full and partial repetition.","يُقسَّم reiteration إلى full repetition وpartial repetition."],
["Full repetition occurs when two lexical items are identical in both form and meaning.","يحدث full repetition عندما يتطابق عنصران معجميان في الشكل والمعنى."],
["Partial repetition, by contrast, involves lexical items that differ in form but share semantic features, such as synonymy, antonymy, hyponymy, meronymy, and the use of general nouns.","أما partial repetition فيشمل عناصر معجمية تختلف في الشكل وتشترك في سمات دلالية، مثل synonymy وantonymy وhyponymy وmeronymy واستخدام general nouns."],
["Collocation refers to the tendency of certain lexical items to co-occur, forming predictable patterns of association within a text.","يشير collocation إلى ميل بعض العناصر المعجمية إلى الظهور معًا، مكوّنةً أنماط ارتباط يمكن توقعها داخل النص."]],
x:`${SEC("trap","Exam trap",`Slide 3 lists reiteration as repetition, synonymy, hyponymy. Slide 9 splits it into full repetition and partial repetition (synonymy, antonymy, hyponymy, meronymy, general nouns). Learn slide 9’s version.<div class="ar">الشريحة 3 تذكر reiteration كـ repetition وsynonymy وhyponymy، أما الشريحة 9 فتقسّمه إلى full repetition وpartial repetition. احفظي نسخة الشريحة 9.</div>`)}`},
{path:"Cohesion basics › Recap",tag:"Recap · ours",t:"Recap: Cohesion basics",ge:"Cohesion makes texture. It comes from five devices: four grammatical, one lexical. Lexical cohesion is reiteration plus collocation.",g:"cohesion يصنع texture، ويأتي من خمس أدوات: أربع grammatical وواحدة lexical. وlexical cohesion هو reiteration مع collocation.",

p:[["Reference occurs when an item in a text depends on another element for its interpretation.","تحدث الإحالة (Reference) عندما يعتمد عنصر في النص على عنصر آخر لتفسيره."],["Reference is the relationship between a linguistic item and the element it refers to.","الإحالة هي العلاقة بين عنصر لغوي والعنصر الذي يشير إليه."],["The words that serve this function are called deictic expressions (deixis), while the elements they point to are known as antecedents.","تُسمّى الكلمات التي تؤدي هذه الوظيفة deictic expressions (deixis)، أما العناصر التي تشير إليها فتُعرف باسم antecedents."]],
},
{path:"Reference › Endophoric / Exophoric",tag:"Slides 12 + 17 · Two types",t:"Endophoric and exophoric reference",ge:"First question, always: is the thing referred to inside the text (endophoric) or outside it, in the situation (exophoric)?",g:"السؤال الأول دائمًا: هل المرجع داخل النص (endophoric) أم خارجه في الموقف (exophoric)؟",
fig:()=>`<div class="dl"><div class="en"><b>Dashed = extra.</b> Related ideas that are not in the lecture ${A("إضافات ليست من المحاضرة")}</div><button id="xt" aria-pressed="${document.body.classList.contains("exam")}">${document.body.classList.contains("exam")?"Show dashed":"Hide dashed"}</button></div>`+FG(0)+`<div class="det" id="det"><div class="en">Click an item in the tree.</div><div class="ar">اضغطي على أي عنصر في الشجرة.</div></div>`,after(){TREE()},
p:[["Reference can be of two types: exophoric, when it refers to something outside the discourse (in the situational context), and endophoric, when it refers to something within the discourse itself.","للإحالة نوعان: exophoric عندما تشير إلى شيء خارج الخطاب (في السياق الموقفي situational context)، وendophoric عندما تشير إلى شيء داخل الخطاب نفسه."],["Some items in a language do not carry meaning fully on their own but instead point to something else for their interpretation.","بعض عناصر اللغة لا تحمل معناها كاملًا بمفردها، بل تشير إلى شيء آخر لتفسيرها."],["These items in English are usually pronouns, demonstratives, and comparatives.","وهذه العناصر في الإنجليزية هي عادةً pronouns (الضمائر) وdemonstratives (أسماء الإشارة) وcomparatives (أدوات المقارنة)."],["In grammar, reference is a type of coherence in which one linguistic element points to another.","في النحو، الإحالة نوع من coherence يشير فيه عنصر لغوي إلى عنصر آخر."],["If it refers to something outside the text, it is considered exophoric.","فإذا أشارت إلى شيء خارج النص عُدّت exophoric."],["Consider the following example:","انظر المثال الآتي:"],["That must have cost a lot of money.","لا بد أن ذلك كلّف الكثير من المال.",1]],
x:`${SEC("note","Our note",`Slide 12 says reference is “a type of coherence”. Slides 4 and 8 place Reference under cohesion (grammatical cohesion), so “coherence” may be a slip. Keep the slide’s wording in mind in case it is asked, and check with your lecturer.<div class="ar">الشريحة 12 تقول coherence، بينما الشريحتان 4 و8 تضعان Reference تحت cohesion. احتفظي بصياغة الشريحة وتأكدي من المحاضر.</div>`)}`,
},
{path:"Reference › Recognizable",tag:"Slide 13",t:"Recognizable references",ge:"“That” alone doesn’t tell us its type: only the context does. What matters is that every reference must be recognizable.",g:"كلمة “that” وحدها لا تكشف نوعها، السياق هو الذي يحدد. والمهم أن يكون كل مرجع قابلًا للتعرّف (recognizable).",
fig:()=>FG(1),after(){PL("pl",THAT)},
p:[
["We cannot immediately tell whether the word ‘that’ is anaphoric (referring back to something already mentioned) or exophoric (pointing to something outside the text).","لا نستطيع أن نحدد فورًا ما إذا كانت الكلمة ‘that’ anaphoric (تشير إلى شيء سبق ذكره) أم exophoric (تشير إلى شيء خارج النص)."],
["The previous speaker might have said, “I’ve just been on holiday in Tahiti,” or the participants could be admiring their host’s antique silver collection.","فقد يكون المتحدث السابق قال: “لقد عدت للتو من عطلة في Tahiti”، أو قد يكون المشاركون يُعجبون بمجموعة الفضيات الأثرية الخاصة بمضيفهم."],
["What is crucial in every instance of reference—whether endophoric (textual) or exophoric (situational)—is the assumption that the reference must be recognizable.","المهم في كل حالة إحالة، سواء كانت endophoric (نصية) أم exophoric (موقفية)، هو افتراض أن المرجع يجب أن يكون recognizable."],
["In other words, the thing being referred to must be identifiable in some way.","أي أن الشيء المُشار إليه يجب أن يكون قابلًا للتحديد (identifiable) بطريقة ما."]]},
{path:"Reference › Fitting room",tag:"Slide 14",t:"The fitting-room example",ge:"In the fitting room, “that” points to a dress already in the text; “this” points to a dress only Mom is holding.",g:"في غرفة القياس تشير “that” إلى فستان مذكور في النص، بينما تشير “this” إلى فستان تحمله الأم فقط.",
fig:()=>FG(1),after(){PL("pl",FITM)},get sp(){return SP6},
p:[
["Consider another example:","انظر مثالًا آخر:"],
["(in a fitting room)","(في غرفة القياس)",1],
["Daughter: Mom, what do you think about this dress?","الابنة: ماما، ما رأيك في هذا الفستان؟",1],
["Mom: Oh dear, I think that’s too short for you. Would you try this? (showing another dress she is holding).","الأم: يا عزيزتي، أظن أن ذلك قصير جدًا عليكِ. هل تجربين هذا؟ (وهي تُري فستانًا آخر في يدها).",1],
["The word “that” refers to the dress the daughter is trying on, making it an example of an endophoric reference since it appears within the text.","الكلمة “that” تشير إلى الفستان الذي تجرّبه الابنة، فهي مثال على إحالة endophoric لأنه مذكور داخل النص."],
["In contrast, “this” points to another dress that the mother is holding, which is not mentioned in the text, and therefore serves as an exophoric reference.","وفي المقابل تشير “this” إلى فستان آخر تحمله الأم ولم يُذكر في النص، ولذلك فهي إحالة exophoric."]]},
{path:"Reference › Endophoric › Anaphoric",tag:"Slide 15 · Direction",t:"Anaphora: pointing back",ge:"Endophoric reference has a direction: anaphora points back to what came before; cataphora points forward to what comes next.",g:"الإحالة endophoric لها اتجاه: anaphora ترجع إلى ما سبق، وcataphora تتطلع إلى ما سيأتي.",
p:[["Endophoric references are further divided according to their direction.","تنقسم الإحالات endophoric بدورها بحسب اتجاهها."],["Endophora is divided into two types: anaphora and cataphora.","تنقسم endophora إلى نوعين: anaphora وcataphora."],["Anaphora refers to a presupposed element that has already been mentioned earlier in the text, whereas cataphora refers to an element that is introduced later in the discourse.","تشير anaphora إلى عنصر مفترَض سبق ذكره في النص، بينما تشير cataphora إلى عنصر يُقدَّم لاحقًا في الخطاب."],["Anaphoric reference occurs when a linguistic unit refers back to an earlier one (the antecedent on the left).","تحدث الإحالة anaphoric عندما تشير وحدة لغوية إلى وحدة سابقة (antecedent على اليسار)."],["It is a form of grammatical cohesion where a word or phrase points to information already mentioned or described previously.","وهي شكل من grammatical cohesion تشير فيه كلمة أو عبارة إلى معلومات سبق ذكرها أو وصفها."],["Consider the following example:","انظر المثال الآتي:"],["The man is living alone. His wife left him for 9 years.","الرجل يعيش وحده. زوجته تركته منذ 9 سنوات.",1],["In this sentence, “his” and “him” are examples of anaphoric reference, since they point back to “the man.”","في هذه الجملة، his وhim مثالان على الإحالة anaphoric لأنهما تشيران رجوعًا إلى the man."],["Without the presupposed clause “the man is living alone,” it would be unclear what “his” and “him” refer to.","ومن دون الجملة المفترَضة the man is living alone لن يكون واضحًا ما الذي تشير إليه his وhim."],["Because their meaning relies on looking back at the preceding sentence, they are classified as anaphoric.","ولأن معناهما يعتمد على النظر إلى الجملة السابقة، فهما تُصنَّفان anaphoric."]],
get sp(){return SP3},},{path:"Reference › Endophoric › Cataphoric",tag:"Slide 16 · Direction",t:"Cataphora: pointing forward",ge:"Cataphora is anaphora reversed: the pointing word comes first, and we must read ahead to find what it means.",g:"cataphora هي عكس anaphora: الكلمة المُشيرة تأتي أولًا، ولا نعرف المقصود إلا بقراءة ما بعدها.",
p:[["Cataphoric reference occurs when a linguistic unit refers forward to another that comes later in the text (the antecedent on the right).","تحدث الإحالة cataphoric عندما تشير وحدة لغوية إلى وحدة تأتي لاحقًا في النص (antecedent على اليمين)."],["It represents grammatical cohesion where a word or phrase anticipates information that will be introduced afterwards.","وهي تمثل grammatical cohesion تستبق فيها كلمة أو عبارة معلومات ستُقدَّم لاحقًا."],["Consider the following example:","انظر المثال الآتي:"],["He’s a superstar, he’s the best in his era. Let’s welcome.. Justin Bieber.","إنه نجم كبير، إنه الأفضل في عصره. لنرحّب بـ.. Justin Bieber.",1],["In this sentence, “he” functions as a cataphoric reference to the presupposed subject “Justin Bieber.”","في هذه الجملة، تؤدي he وظيفة إحالة cataphoric إلى الفاعل (subject) المفترَض Justin Bieber."],["To identify what “he” refers to, we must look ahead to the following sentence.","ولمعرفة ما تشير إليه he، يجب أن ننظر إلى الجملة التالية."]],
get sp(){return SP4},},{path:"Reference › the whole map",tag:"Recap · ours",t:"Recap: Reference",ge:"One screen to hold it all: three questions that sort any example, then a final test.",g:"شاشة واحدة تجمع كل شيء: ثلاثة أسئلة تصنّف أي مثال، ثم اختبار أخير.",
fig:()=>FG(0)+`<div class="det"><div class="en">Start at 1 and follow the arrows until you reach a type.</div><div class="ar">ابدئي من 1 واتبعي الأسهم حتى تصلي إلى النوع.</div></div>`,after(){PL("pl",DEC)},
p:[],x:`${RC([["Reference: a word depends on another element for its interpretation (deictic expression → antecedent).","Reference: كلمة تعتمد على عنصر آخر لتفسيرها (deictic expression → antecedent)."],["Two types: exophoric (situational) and endophoric (textual), which splits into anaphora (back) and cataphora (forward).","نوعان: exophoric وendophoric، والأخير ينقسم إلى anaphora (للخلف) وcataphora (للأمام)."],["Every reference must be recognizable; “that” and “this” depend on context.","يجب أن يكون كل مرجع recognizable، وthat وthis يعتمدان على السياق."]])}${SEC("","Compare",`<table class="cmp"><tr><th>Type</th><th>Antecedent</th><th>Lecture example</th></tr><tr><td class="cg">anaphoric</td><td>inside the text, on the left</td><td>his, him → the man</td></tr><tr><td class="cg">cataphoric</td><td>inside the text, on the right</td><td>he → Justin Bieber</td></tr><tr><td class="ca">exophoric</td><td>outside the text, in the situation</td><td>“this” (second dress)</td></tr></table>`,"ours, not the lecture’s")}${SEC("trap","Exam trap",`“that” is not automatically one type: in the fitting room, “that” is endophoric and “this” is exophoric. Context decides.<div class="ar">لا تحفظي الكلمة نفسها: السياق هو الذي يحدد النوع.</div>`)}`,

{o:["Yes: “that” is always exophoric","Yes: “that” is always endophoric","No: context decides","No: it is neither type"],c:2,qe:"In “That must have cost a lot of money,” can you tell the type of reference immediately?",ae:"No. “That” may point to something already mentioned or to something in the situation; context decides.",q:"في الجملة That must have cost a lot of money، هل يمكن تحديد النوع فورًا؟",a:"لا. السياق هو الذي يحدد."},

{o:["“that” (too short for you)","“this” (Would you try this?)","“dress”","“you”"],c:1,qe:"In the fitting room, which word is exophoric?",ae:"“this” points to another dress Mom is holding, which the text never mentions.",q:"في مثال غرفة القياس، أي كلمة exophoric؟",a:"this لأنها تشير إلى فستان تحمله الأم ولم يُذكر في النص."},
{o:["Their antecedent comes before them","Their antecedent comes after them","They point outside the text","They replace a verb"],c:0,qe:"Why are “his” and “him” classified as anaphoric?",ae:"Their antecedent, “the man”, comes before them, so we look back.",q:"لماذا تُصنَّف his وhim على أنهما anaphoric؟",a:"لأن antecedent وهو the man يأتي قبلهما فننظر إلى الخلف."},
{o:["The antecedent is outside the text","Cataphora points back, anaphora forward","There is no difference","The antecedent comes later, so you look ahead"],c:3,qe:"How is cataphora different from anaphora?",ae:"In cataphora the antecedent comes later (on the right), so you must look ahead.",q:"ما الفرق بين cataphora وanaphora؟",a:"في cataphora يأتي antecedent لاحقًا فننظر إلى الأمام."}]},
{path:"Substitution",tag:"Part 3 · Start",t:"Part 3: Substitution",ge:"Part 3 shows how one word can stand in for another: nominal (one, ones, same), verbal (do) and clausal (so, not).",g:"يشرح الجزء الثالث كيف تحلّ كلمة محل أخرى: nominal (one وones وsame) وverbal (do) وclausal (so وnot).",
fig:()=>FG(1),after(){PL("pl",P3MAP)},p:[],
x:`${SEC("","By the end you can…",`<ul class="bl"><li>say what substitution is and how it differs from reference</li><li>name the three types and their substitutes</li><li>spot the substitute and the item it replaces</li></ul><div class="ar">بنهاية الجزء تستطيعين: تعريف substitution وفرقه عن reference، وتسمية أنواعه الثلاثة وبدائلها، وتحديد البديل والعنصر الذي يحلّ محله.</div>`)}${SEC("","Words you need first",`<table class="cmp"><tr><th>term</th><th>what it means</th><th>example</th></tr><tr><td>noun ${A("اسم")}</td><td>a word for a person, thing or idea</td><td>biscuits, bread</td></tr><tr><td>nominal ${A("اسمي")}</td><td>“about a noun”</td><td>fresh ones</td></tr><tr><td>verb ${A("فعل")}</td><td>a word for an action or state</td><td>come, know, do</td></tr><tr><td>verbal ${A("فعلي")}</td><td>“about a verb”</td><td>you do either</td></tr><tr><td>clause ${A("جملة")}</td><td>a unit with a subject and a predicate</td><td>It says so.</td></tr><tr><td>subject ${A("المسند إليه")}</td><td>who or what the clause is about</td><td>The student</td></tr><tr><td>predicate ${A("المسند")}</td><td>what is said about the subject; it contains the verb</td><td>understands English</td></tr></table><div class="en">A verb is one part of a clause: in “The student understands English”, the verb is “understands”, and the whole clause is the subject plus the predicate.</div><div class="en"><b>clausal is not causal.</b> Clausal is about a clause (it starts with CL). Causal is about a cause, a reason.</div><div class="ar">الـ verb جزء من الـ clause. وكلمة clausal تخص الـ clause (تبدأ بـ CL)، أما causal فتخص السبب.</div>`,"ours")}`},
{path:"Substitution › What it is",tag:"Slide 19",t:"What is substitution?",ge:"Substitution swaps wording for wording. Reference works through meaning. Three types: nominal, verbal, clausal.",g:"substitution يستبدل صياغة بصياغة، أما reference فيعمل عبر المعنى. وله ثلاثة أنواع: nominal وverbal وclausal.",
fig:()=>FG(1),after(){PL("pl",S1)},
p:[
["Substitution is the process of replacing one word with another.","الـ substitution هو عملية استبدال كلمة بكلمة أخرى."],
["Substitution is a type of grammatical cohesion where specific linguistic units are replaced by other units within a discourse.","وهو نوع من grammatical cohesion تُستبدل فيه وحدات لغوية محددة بوحدات أخرى داخل الخطاب."],
["Halliday and Hasan (1976, p.88) explain the main difference between substitution and reference, that is, substitution concerns the wording itself, while reference relates more to meaning.","يشرح Halliday وHasan (1976, p.88) الفرق الرئيسي بين substitution وreference: الأول يتعلق بالصياغة نفسها، والثاني يتعلق أكثر بالمعنى."],
["Since substitution deals with grammar, it is a relation in wording rather than in meaning.","ولأن substitution يتعامل مع النحو فهو علاقة في الصياغة (wording) لا في المعنى."],
["Therefore, the various types of substitution are identified on grammatical grounds instead of semantic ones.","ولذلك تُحدَّد أنواعه على أسس نحوية لا دلالية."],
["In English, a substitute can take the role of a noun, a verb, or a clause, which correspond to the three types of substitution: nominal, verbal, and clausal.","وفي الإنجليزية قد يؤدي البديل (substitute) دور اسم أو فعل أو clause، وهي أنواع substitution الثلاثة: nominal وverbal وclausal."]]},
{path:"Substitution › Nominal",tag:"Slides 20–21",t:"Nominal substitution",ge:"A nominal substitute (one, ones, same) takes the place of a noun that is the Head of its group, even when its number differs.",g:"البديل الاسمي (one وones وsame) يحلّ محل اسم هو Head في مجموعته، حتى لو اختلف العدد.",
fig:()=>FG(1),after(){PL("pl",S2)},
p:[
["Nominal substitution is a grammatical process where a noun or a noun phrase is replaced by a substitute word, usually to avoid repetition in a sentence.","الـ nominal substitution عملية نحوية يُستبدل فيها اسم أو عبارة اسمية بكلمة بديلة، عادةً لتجنب التكرار في الجملة."],
["The most common substitutes are “one,” “ones,” and “same.”","وأكثر البدائل شيوعًا هي one وones وsame."],
["The substitute one/ones always functions as the Head of a nominal group and can only replace an item that itself serves as the Head of a nominal group.","البديل one/ones يؤدي دائمًا وظيفة Head في nominal group، ولا يستبدل إلا عنصرًا يؤدي هو نفسه وظيفة Head في nominal group."],
["For instance:","مثلًا:"],
["I shoot the hippopotamus with bullets made of platinum because if I use leaden ones his hide is sure to flatten 'em.","أصوّب على فرس النهر برصاص مصنوع من البلاتين، لأنني لو استخدمت رصاصًا من الرصاص (leaden) فمن المؤكد أن جلده سيسطّحه.",1],
["In this example, ‘bullets’ is the Head of the nominal group ‘bullets made of platinum’, while ‘ones’ is the Head of the nominal group ‘leaden ones’.","في هذا المثال bullets هي Head في nominal group ‘bullets made of platinum’، بينما ones هي Head في nominal group ‘leaden ones’."],
["The substitute may also vary in number from the presupposed item.","وقد يختلف البديل في العدد عن العنصر المفترَض (presupposed item)."],
["For example, in the following, the presupposed word is the singular cherry, while the substitute is plural:","مثلًا، في ما يلي الكلمة المفترَضة هي cherry المفردة بينما البديل جمع:"],
["Cherry ripe, cherry ripe, ripe I cry. Full and fair ones - come and buy.","كرز ناضج، كرز ناضج، أنادي ناضجًا. كرز ممتلئ وجميل، تعالوا واشتروا.",1]]},
{path:"Substitution › Count nouns",tag:"Slide 22",t:"Count nouns and zero",ge:"Only count nouns can be substituted. For mass nouns the only option is zero: that is ellipsis.",g:"لا يُستبدل إلا الـ count nouns. أما الـ mass nouns فالخيار الوحيد هو الصفر، وهذا هو ellipsis.",
fig:()=>FG(1),after(){PL("pl",S3)},
p:[
["The presupposed noun is always a count noun, since there is no substitute form for mass nouns.","الاسم المفترَض دائمًا count noun، إذ لا يوجد شكل بديل لـ mass nouns."],
["Compare [a and b]:","قارني بين [a وb]:"],
["A- These biscuits are stale. – Get some fresh ones.","A- هذا البسكويت قديم. – أحضري بعضًا طازجًا.",1],
["B- This bread’s stale. – Get some fresh.","B- هذا الخبز قديم. – أحضري بعضًا طازجًا.",1],
["In example (b), the only available substitution is by zero, which is referred to as ellipsis.","في المثال (b) الاستبدال الوحيد المتاح هو بالصفر (by zero)، وهو ما يُسمّى ellipsis."],
["From a semantic perspective, ellipsis and substitution are closely related; ellipsis may be understood as substitution without an explicit substitute.","من الناحية الدلالية يرتبط ellipsis وsubstitution ارتباطًا وثيقًا؛ ويمكن فهم ellipsis على أنه substitution بلا بديل صريح."],
["Grammatically, however, the two processes are quite distinct.","أما نحويًا فالعمليتان مختلفتان تمامًا."]]},
{path:"Substitution › Verbal",tag:"Slides 23–25",t:"Verbal substitution",ge:"The verbal substitute is do. In “…as they used to do” it stands for come; in “…you do either” it stands for know the meaning of half those long words. Not did, not don’t.",g:"البديل الفعلي هو do. في “…as they used to do” تحلّ محل come، وفي “…you do either” تحلّ محل know the meaning of half those long words. وليس did ولا don’t.",
fig:()=>FG(1),after(){PL("pl",S4)},
p:[
["The process of replacing a linguistic unit classified as a verb with another verb is called verbal substitution.","عملية استبدال وحدة لغوية مصنّفة فعلًا بفعل آخر تسمى verbal substitution."],
["Verbal substitution refers to the replacement of verbs with the forms do, did, or other auxiliary verbs.","ويشير verbal substitution إلى استبدال الأفعال بالصيغ do أو did أو أفعال مساعدة أخرى."],
["In English, the verbal substitute is do.","وفي الإنجليزية البديل الفعلي هو do."],
["It functions as the Head of a verbal group, taking the place normally filled by the lexical verb, and it always appears in the final position within the group.","ويؤدي وظيفة Head في verbal group، فيحلّ محل الفعل المعجمي (lexical verb)، ويأتي دائمًا في الموضع الأخير داخل المجموعة."],
["Consider these two examples; in both cases, the substitute is the word do (not did or don’t):","انظري هذين المثالين؛ في الحالتين البديل هو الكلمة do (وليس did أو don’t):"],
["A- the words did not come the same as they used to do.","A- الكلمات لم تأتِ كما اعتادت أن تفعل.",1],
["B- ‘I don’t know the meaning of half those long words, and, what’s more, I don’t believe you do either!’","B- ‘لا أعرف معنى نصف هذه الكلمات الطويلة، وفوق ذلك لا أظنك تعرفه أيضًا!’",1],
["In example (a), do substitutes for come, while in (b), it replaces know the meaning of half those long words.","في المثال (a) تحلّ do محل come، وفي (b) تحلّ محل know the meaning of half those long words."],
["In these two examples, the presupposed items appear in the same sentence, so substitution alone does not create cohesion.","في هذين المثالين يظهر العنصر المفترَض في الجملة نفسها، فلا يصنع substitution وحده cohesion."],
["However, verbal substitution often operates across sentence boundaries, as shown in the following examples:","غير أن verbal substitution كثيرًا ما يعمل عبر حدود الجمل، كما في الأمثلة التالية:"]],
x:`${SEC("note","Also notice",`In example A, “they” points back to “the words” (a Reference, anaphoric) while “do” replaces “come” (a substitution). One sentence can use both ties.<div class="ar">في المثال A تشير they إلى the words (Reference من نوع anaphoric)، بينما تحلّ do محل come (substitution). الجملة الواحدة قد تجمع الرابطتين.</div>`)}`},
{path:"Substitution › Clausal",tag:"Slide 26",t:"Clausal substitution",ge:"Clausal substitution replaces a whole clause with so or not. The contrasting element stays outside the clause.",g:"يستبدل clausal substitution الـ clause كلها بـ so أو not، ويبقى العنصر المتباين خارجها.",
fig:()=>FG(1),after(){PL("pl",S5)},
p:[
["There is another kind of substitution in which what is replaced is not just an element inside the clause but the entire clause itself.","هناك نوع آخر من substitution لا يُستبدل فيه عنصر داخل الجملة فقط، بل الـ clause كلها."],
["The substitutes used in this case are so and nor.","والبدائل المستخدمة هنا هي so وnor."],
["Clausal substitution is the process of replacing a clause with so or not.","الـ clausal substitution هو استبدال clause بـ so أو not."],
["This type of substitution is used to prevent the exact repetition of words in subsequent sentences or clauses.","ويُستخدم هذا النوع لمنع التكرار الحرفي للكلمات في الجمل أو الـ clauses اللاحقة."],
["In clausal substitution, the entire clause is presupposed, and the contrasting element lies outside of it.","وفي clausal substitution تكون الـ clause كلها مفترَضة، ويقع العنصر المتباين خارجها."],
["For example:","مثلًا:"],
["Is there going to be an earthquake? – It says so.","هل سيحدث زلزال؟ – إنه يقول ذلك.",1],
["Here, ‘so’ substitutes for the whole clause there’s going to be an earthquake, while the contrasting context is introduced by says, which is outside that clause.","هنا تحلّ ‘so’ محل الـ clause كلها there’s going to be an earthquake، بينما يأتي السياق المتباين عبر says الواقعة خارجها."]],
x:`${SEC("trap","Exam trap",`The slide says “so and nor” once and “so or not” right after. “nor” is a typo: the clausal substitutes are so and not.<br>Classify by what is replaced (a noun, a verbal expression or a whole clause), not by how many words are replaced.<div class="ar">الشريحة تقول “so and nor” ثم “so or not”. كلمة nor خطأ مطبعي: بدائل clausal هي so وnot. صنّفي بحسب ما يُستبدل (اسم أو تعبير فعلي أو clause كاملة) لا بحسب عدد الكلمات.</div>`)}${SEC("","Verbal or clausal?",`<table class="cmp"><tr><th></th><th>verbal</th><th>clausal</th></tr><tr><td>substitute</td><td>do</td><td>so, not</td></tr><tr><td>replaces</td><td>a verbal expression</td><td>a whole clause</td></tr><tr><td>example</td><td>I don’t believe you do either</td><td>It says so</td></tr><tr><td>what stays</td><td>the subject (“you”)</td><td>the saying clause (“It says”)</td></tr></table>`,"ours")}`},
{path:"Substitution › Recap",tag:"Recap · ours",t:"Recap: Substitution",ge:"Substitution = wording replaced by a substitute. Three types by what is replaced: a noun (one, ones, same), a verb (do), a clause (so, not).",g:"substitution = استبدال صياغة ببديل، وله ثلاثة أنواع بحسب ما يُستبدل: اسم (one وones وsame) أو فعل (do) أو clause (so وnot).",
fig:()=>FG(1),after(){PL("pl",S6)},get sp(){return SPSUB},p:[],
x:`${RC([["Substitution is a relation in wording; reference is more about meaning.","substitution علاقة في الصياغة، وreference أقرب إلى المعنى."],["Nominal (one, ones, same), verbal (do), clausal (so, not): classify by what is replaced.","nominal وverbal وclausal: صنّفي بحسب ما يُستبدل."],["Only count nouns can be substituted; for mass nouns there is only zero, which is ellipsis.","الـ count nouns فقط تُستبدل؛ أما mass nouns فالصفر وهو ellipsis."]])}`},
{path:"Substitution › Quiz",tag:"Quiz · ours",t:"Part 3 quiz",ge:"Six questions to prove you’ve got Substitution.",g:"ستة أسئلة لتتأكدي أنك أتقنتِ Substitution.",p:[],qs:[

{o:["one, ones, same","do, did","so, not","this, that"],c:0,qe:"Which are the most common nominal substitutes?",ae:"“one”, “ones” and “same”.",q:"ما أكثر البدائل الاسمية شيوعًا؟",a:"one وones وsame."},
{o:["Bread is a mass noun, so only zero substitution (ellipsis) is possible","“Bread” is a verb","“Some” cannot be used","Fresh is a noun"],c:0,qe:"Why is “This bread’s stale. – Get some fresh.” not nominal substitution by “one”?",ae:"Bread is a mass noun: there is no substitute form, only substitution by zero, which is ellipsis.",q:"لماذا ليس ‘Get some fresh’ استبدالًا اسميًا بـ one؟",a:"لأن bread هو mass noun، فالاستبدال بالصفر وهو ellipsis."},
{o:["did","do","don’t","done"],c:1,qe:"Which word is the verbal substitute in English?",ae:"“do” (not did or don’t).",q:"ما البديل الفعلي في الإنجليزية؟",a:"do وليس did أو don’t."},
{o:["The whole clause","Only the verb says","Only the noun earthquake","A pronoun"],c:0,qe:"In “Is there going to be an earthquake? – It says so.”, what does “so” replace?",ae:"The whole clause there’s going to be an earthquake.",q:"ماذا تحلّ so محله؟",a:"الـ clause كلها."},
{o:["Three: nominal, verbal, clausal","Two: nominal and verbal","Four: nominal, verbal, clausal, lexical","Three: reference, ellipsis, conjunction"],c:0,qe:"How many types of substitution are there, and what are they?",ae:"Three, by what is replaced: a noun, a verb or a clause.",q:"كم نوعًا من substitution وما هي؟",a:"ثلاثة: nominal وverbal وclausal."}]},
{path:"Ellipsis",tag:"Part 4 (Start)",t:"Part 4: Ellipsis",ge:"Part 4 shows what happens when a word is left out and the reader still understands: ellipsis, in its nominal and verbal forms.",g:"يشرح الجزء الرابع ما يحدث عندما تُحذف كلمة ويظل القارئ يفهم: ellipsis بنوعيه nominal وverbal.",
fig:()=>FG(1),after(){PL("pl",P4MAP)},p:[],
x:`${SEC("","By the end you can…",`<ul class="bl"><li>say what ellipsis is and why it is “substitution by zero”</li><li>find the missing Head in a nominal group</li><li>recognise verbal ellipsis in short answers</li></ul><div class="ar">بنهاية الجزء تستطيعين: تعريف ellipsis ولماذا يُسمّى substitution بالصفر، وإيجاد الـ Head المحذوف في nominal group، والتعرّف على verbal ellipsis في الإجابات القصيرة.</div>`)}${SEC("","Words you need first",`<table class="cmp"><tr><th>term</th><th>what it means</th><th>example</th></tr><tr><td>ellipsis ${A("حذف")}</td><td>leaving a word out because the context already supplies it</td><td>I know twelve more.</td></tr><tr><td>presupposed ${A("مفترَض")}</td><td>taken for granted from the earlier text</td><td>verses</td></tr><tr><td>nominal group ${A("مجموعة اسمية")}</td><td>a noun with its modifiers</td><td>those two fast electric trains</td></tr><tr><td>Head ${A("الرأس")}</td><td>the main noun of the group</td><td>trains</td></tr><tr><td>Modifier ${A("المعدِّل")}</td><td>a word that points to, counts or describes the Head</td><td>those, two, fast, electric</td></tr><tr><td>verbal group ${A("مجموعة فعلية")}</td><td>the verb with its helpers</td><td>have been swimming</td></tr></table><div class="en">In a clause, the Predicator is the verb part and the Complement is what completes it: Catherine (Subject) [brought] (Predicator) some sweet peas (Complement).</div>`,"ours")}`},
{path:"Ellipsis › What it is",tag:"Slides 28–29",t:"What is ellipsis?",ge:"Ellipsis leaves a word unsaid, but the reader still understands it from the earlier text.",g:"ellipsis يترك كلمة غير منطوقة، ومع ذلك يفهمها القارئ من النص السابق.",
fig:()=>FG(1),after(){PL("pl",E1)},
p:[
["Ellipsis is the process in which an element in a text or discourse is omitted and replaced by nothing.","الـ ellipsis هو عملية يُحذف فيها عنصر من نص أو خطاب ويُستبدل بلا شيء."],
["It takes place when something that is structurally required is left unspoken because it is already understood from the context.","ويحدث عندما يُترك شيء مطلوب بنيويًا دون قوله لأنه مفهوم أصلًا من السياق."],
["Ellipsis refers to what is left unspoken in discourse.","فـ ellipsis يشير إلى ما يُترك غير منطوق في الخطاب."],
["Although not explicitly communicated, it can still be understood, with meaning recovered from the surrounding context, particularly the textual context.","ورغم أنه غير معبَّر عنه صراحةً فإنه يُفهم، إذ يُستعاد المعنى من السياق المحيط، وخاصةً السياق النصي."],
["In general, ellipsis occurs when an element that is structurally expected is absent.","وبوجه عام يحدث ellipsis عندما يغيب عنصر متوقَّع بنيويًا."],
["As a result, the expression may appear incomplete.","ونتيجةً لذلك قد يبدو التعبير ناقصًا."],
["A good starting point for discussing ellipsis is the familiar idea that it is “something left unsaid.”","ونقطة بداية جيدة لمناقشة ellipsis هي الفكرة المألوفة أنه “شيء تُرك دون قول”."],
["This does not mean that the unspoken part is not understood; in fact, “unsaid” implies “understood nonetheless.”","وهذا لا يعني أن الجزء غير المنطوق غير مفهوم؛ بل إن “unsaid” تعني “مفهوم رغم ذلك”."],
["Ellipsis can therefore also be described as something understood, with “understood” here meaning “taken for granted”.","ولذلك يمكن وصف ellipsis أيضًا بأنه شيء مفهوم، وتعني “مفهوم” هنا “مُسلَّم به”."],
["Ellipsis refers specifically to cases where the structure of a sentence, clause, or phrase presupposes the existence of a prior element, which then provides the missing information.","ويشير ellipsis تحديدًا إلى الحالات التي تفترض فيها بنية الجملة أو clause أو العبارة وجود عنصر سابق يوفّر المعلومة الناقصة."],
["An elliptical form, in effect, leaves open structural slots that must be filled from elsewhere.","فالشكل elliptical يترك فعليًا فراغات بنيوية يجب ملؤها من مكان آخر."]]},
{path:"Ellipsis › Substitution by zero",tag:"Slide 30",t:"Substitution by zero",ge:"Ellipsis is substitution by zero: the slot is there, but no counter fills it. “Catherine ___ some sweet peas” can only mean Catherine brought some sweet peas.",g:"ellipsis هو substitution بالصفر: الفراغ موجود لكن لا يملؤه أي counter. و“Catherine ___ some sweet peas” لا تعني إلا Catherine brought some sweet peas.",
fig:()=>FG(1),after(){PL("pl",E2)},
p:[
["This is directly parallel to substitution.","وهذا موازٍ مباشرةً لـ substitution."],
["In substitution, however, an explicit “counter” such as ‘one’ or ‘do’ is placed in the slot to represent what is presupposed, while in ellipsis nothing is inserted.","لكن في substitution يوضع “counter” صريح مثل one أو do في الفراغ ليمثّل المفترَض، أما في ellipsis فلا يُدرج شيء."],
["For this reason, ellipsis can be seen as substitution by zero.","ولهذا يمكن اعتبار ellipsis هو substitution بالصفر (by zero)."],
["For example:","مثلًا:"],
["Joan brought some carnations, and Catherine some sweet peas.","أحضرت Joan بعض القرنفل، وCatherine بعض البازلاء الحلوة.",1],
["In the second clause, the structure is made up of a Subject and a Complement.","في الـ clause الثانية تتكوّن البنية من Subject وComplement."],
["This type of structure normally appears only when one element—the Predicator—is presupposed and supplied from the earlier clause.","وهذا النوع من البنى لا يظهر عادةً إلا عندما يكون عنصر واحد، هو Predicator، مفترَضًا ومأخوذًا من الـ clause السابقة."],
["In this case, no other reading is possible: the second clause must mean Catherine brought some sweet peas.","وهنا لا قراءة أخرى ممكنة: يجب أن تعني الـ clause الثانية Catherine brought some sweet peas."],
["The two clauses are therefore structurally connected, with the second clause acting as a branched extension.","فالـ clausetان مترابطتان بنيويًا، وتعمل الثانية كامتداد متفرّع."],
["Now consider:","الآن تأملي:"]]},
{path:"Ellipsis › Presupposition",tag:"Slides 31–32",t:"Presupposition at work",ge:"“I know twelve more” and “nine the next”: the missing Head is always recovered from the sentence before.",g:"“I know twelve more” و“nine the next”: الـ Head المحذوف يُستعاد دائمًا من الجملة السابقة.",
fig:()=>FG(1),after(){PL("pl",E3)},
p:[
["Would you like to hear another verse? I know twelve more.","هل تودّ سماع بيت شعر آخر؟ أعرف اثني عشر آخرين.",1],
["Here, the two sentences are not structurally related.","هنا الجملتان غير مرتبطتين بنيويًا."],
["The second contains the nominal group twelve more, which consists only of a Numerative.","تحتوي الثانية على nominal group هي twelve more وتتكوّن من Numerative فقط."],
["The Head noun verses must be inferred from the first sentence.","أما الاسم Head وهو verses فيجب استنتاجه من الجملة الأولى."],
["A nominal group containing only a Numerative, but no Head typically occurs only in contexts of presupposition.","و nominal group التي تحتوي Numerative فقط بلا Head لا تظهر عادةً إلا في سياقات الافتراض المسبق."],
["A slightly more complex example is:","ومثال أعقد قليلًا هو:"],
["“And how many hours a day did you do lessons?” said Alice, in a hurry to change the subject. “Ten hours the first day,” said the Mock Turtle: “nine the next, and so on.”","“وكم ساعة في اليوم كنتم تتلقون الدروس؟” قالت Alice وهي تستعجل تغيير الموضوع. “عشر ساعات في اليوم الأول”، قال Mock Turtle: “وتسع في التالي، وهكذا”.",1],
["Here, Halliday and Hasan explain that the nominal group nine presupposes nine hours, while the next presupposes the next day.","هنا يوضّح Halliday وHasan أن nominal group هي nine تفترض nine hours، بينما the next تفترض the next day."],
["Likewise, the clauses nine the next and ten hours the first day both presuppose fuller forms such as we did lessons nine hours the next day or we did lessons ten hours the first day.","وكذلك تفترض الـ clauses هي nine the next وten hours the first day صيغًا أكمل مثل we did lessons nine hours the next day أو we did lessons ten hours the first day."],
["In each case, the clauses and nominal groups clearly signal presupposition.","وفي كل حالة تدل الـ clauses والـ nominal groups بوضوح على الافتراض المسبق."]]},
{path:"Ellipsis › Nominal ellipsis",tag:"Slides 33–35",t:"The nominal group",ge:"A nominal group has a Head plus modifiers. When the Head noun is dropped, a modifier takes its place: that is nominal ellipsis.",g:"الـ nominal group لها Head ومعدِّلات. وعندما يُحذف الاسم Head يحلّ محله أحد المعدِّلات، وهذا هو nominal ellipsis.",
fig:()=>FG(1),after(){PL("pl",E4)},
p:[
["Nominal ellipsis is ellipsis that takes place within the nominal group.","الـ nominal ellipsis هو ellipsis الذي يحدث داخل الـ nominal group."],
["As discussed before, the logical structure of a nominal group consists of a Head, which may be accompanied by optional modifiers.","كما سبق، تتكوّن البنية المنطقية لـ nominal group من Head قد ترافقه معدِّلات (modifiers) اختيارية."],
["These modifiers can occur before the Head (Premodifiers) or after it (Postmodifiers).","وهذه المعدِّلات تأتي قبل الـ Head (Premodifiers) أو بعده (Postmodifiers)."],
["For instance, in ‘those two fast electric trains with pantographs’, the Head is ‘trains’, the Premodifier is ‘those two fast electric’, and the Postmodifier is ‘with pantographs’.","مثلًا في ‘those two fast electric trains with pantographs’ الـ Head هو trains، والـ Premodifier هو those two fast electric، والـ Postmodifier هو with pantographs."],
["Halliday and Hasan indicate that the Modifier interacts with a structure comprising the following elements: Deictic (d), Numerative (n), Epithet (e), Classifier (c), and Qualifier (q).","يشير Halliday وHasan إلى أن الـ Modifier يتفاعل مع بنية تضم العناصر: Deictic (d) وNumerative (n) وEpithet (e) وClassifier (c) وQualifier (q)."],
["In the example above, these are realized as those (d), two (n), fast (e), electrics (c), and with pantographs (q).","وفي المثال أعلاه تتحقق هذه العناصر في those (d) وtwo (n) وfast (e) وelectrics (c) وwith pantographs (q)."],
["The Head of a nominal group, which is always present, is typically realized by a common noun, proper noun, or pronoun that expresses the Thing.","الـ Head في nominal group حاضر دائمًا، ويتحقق عادةً باسم عام (common noun) أو علم (proper noun) أو ضمير يعبّر عن الـ Thing."],
["Proper nouns denote specific individuals and therefore cannot be further specified.","وتدل الأعلام على أفراد محددين ولذلك لا يمكن تخصيصها أكثر."],
["Common nouns, on the other hand, represent classes of entities and are often further specified through elements such as the Deictic, Numerative, Epithet, or Classifier.","أما الأسماء العامة فتمثّل فئات من الكيانات وكثيرًا ما تُخصَّص بعناصر مثل Deictic أو Numerative أو Epithet أو Classifier."],
["Under certain conditions, however, the common noun may be omitted, and one of these other elements can take over the function of Head.","لكن في ظروف معينة قد يُحذف الاسم العام ويتولى أحد هذه العناصر وظيفة Head."],
["This is what is meant by nominal ellipsis.","وهذا هو المقصود بـ nominal ellipsis."],
["In a full (non-elliptical) nominal group, Halliday and Hasan (1976) maintain that the Head represents the Thing—the noun that names the individual or class being referred to.","في nominal group الكاملة (غير elliptical) يرى Halliday وHasan (1976) أن الـ Head يمثّل الـ Thing، أي الاسم الذي يسمّي الفرد أو الفئة المُشار إليها."],
["This may include a person, object (animate or inanimate), abstraction, institution, process, quality, state, or relation.","وقد يشمل شخصًا أو شيئًا (حيًّا أو غير حي) أو مفهومًا مجردًا أو مؤسسة أو عملية أو صفة أو حالة أو علاقة."],
["In an elliptical nominal group, by contrast, this element is omitted, and another element (Deictic, Numerative, Epithet, or Classifier) serves as the Head.","أما في nominal group الـ elliptical فيُحذف هذا العنصر ويعمل عنصر آخر (Deictic أو Numerative أو Epithet أو Classifier) كـ Head."]]},
{path:"Ellipsis › Nominal ellipsis",tag:"Slide 36",t:"A modifier becomes Head",ge:"In “another four” and “the straight”, a Modifier is promoted to Head.",g:"في “another four” و“the straight” يُرقّى Modifier إلى Head.",
fig:()=>FG(1),after(){PL("pl",E5)},
p:[
["Thus, nominal ellipsis involves the promotion of a Modifier—Deictic, Numerative, Epithet, or Classifier—so that it takes on the role of Head.","إذًا يتضمن nominal ellipsis ترقية Modifier (Deictic أو Numerative أو Epithet أو Classifier) ليؤدي دور الـ Head."],
["For example:","مثلًا:"],
["Four other Oysters followed them, / and yet another four.","تبعتهم أربعة محار آخر، / وأربعة أخرى.",1],
["Here, four, usually a Numerative and therefore a Modifier, functions instead as Head.","هنا تعمل four، وهي عادةً Numerative وبالتالي Modifier، بدلًا من ذلك كـ Head."],
["Which last longer, the curved rods or the straight rods? – The straight are less likely to break.","أيهما يدوم أطول، القضبان المنحنية أم المستقيمة؟ – المستقيمة أقل عرضة للكسر.",1],
["Here, straight functions as an Epithet (Modifier) in the first clause but as Head in the reply.","هنا تعمل straight كـ Epithet (Modifier) في الـ clause الأولى لكنها Head في الرد."],
["Both ‘another four’ and ‘the straight’ are instances of elliptical nominal groups.","وكلٌّ من ‘another four’ و‘the straight’ مثال على nominal groups من نوع elliptical."]]},
