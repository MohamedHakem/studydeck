p:[["Reference occurs when an item in a text depends on another element for its interpretation.","تحدث الإحالة (Reference) عندما يعتمد عنصر في النص على عنصر آخر لتفسيره."],["Reference is the relationship between a linguistic item and the element it refers to.","الإحالة هي العلاقة بين عنصر لغوي والعنصر الذي يشير إليه."],["The words that serve this function are called deictic expressions (deixis), while the elements they point to are known as antecedents.","تُسمّى الكلمات التي تؤدي هذه الوظيفة deictic expressions (deixis)، أما العناصر التي تشير إليها فتُعرف باسم antecedents."]],
o:["antecedent, then deictic expression","deictic expression, then antecedent","endophoric, then exophoric","anaphora, then cataphora"],c:1,qe:"What is the pointing item called, and what is the item it points to called?",ae:"The pointing item: deictic expression (deixis). The item pointed to: antecedent.",q:"ما اسم العنصر الذي يشير، وما اسم العنصر المُشار إليه؟",a:"الأول: deictic expression (deixis). والثاني: antecedent."},

p:[["Reference can be of two types: exophoric, when it refers to something outside the discourse (in the situational context), and endophoric, when it refers to something within the discourse itself.","للإحالة نوعان: exophoric عندما تشير إلى شيء خارج الخطاب (في السياق الموقفي situational context)، وendophoric عندما تشير إلى شيء داخل الخطاب نفسه."],["Some items in a language do not carry meaning fully on their own but instead point to something else for their interpretation.","بعض عناصر اللغة لا تحمل معناها كاملًا بمفردها، بل تشير إلى شيء آخر لتفسيرها."],["These items in English are usually pronouns, demonstratives, and comparatives.","وهذه العناصر في الإنجليزية هي عادةً pronouns (الضمائر) وdemonstratives (أسماء الإشارة) وcomparatives (أدوات المقارنة)."],["In grammar, reference is a type of coherence in which one linguistic element points to another.","في النحو، الإحالة نوع من coherence يشير فيه عنصر لغوي إلى عنصر آخر."],["If it refers to something outside the text, it is considered exophoric.","فإذا أشارت إلى شيء خارج النص عُدّت exophoric."],["Consider the following example:","انظر المثال الآتي:"],["That must have cost a lot of money.","لا بد أن ذلك كلّف الكثير من المال.",1]],
x:`<details class="sec note" open><summary><span>Our note</span><b class="chv"></b></summary><div class="sb">Slide 12 says reference is “a type of coherence”. Slides 4 and 8 place Reference under cohesion (grammatical cohesion), so “coherence” may be a slip. Keep the slide’s wording in mind in case it is asked, and check with your lecturer.<div class="ar">الشريحة 12 تقول coherence، بينما الشريحتان 4 و8 تضعان Reference تحت cohesion. احتفظي بصياغة الشريحة وتأكدي من المحاضر.</div></div></details>`,
o:["Yes: “that” is always exophoric","Yes: “that” is always endophoric","No: context decides","No: it is neither type"],c:2,qe:"In “That must have cost a lot of money,” can you tell the type of reference immediately?",ae:"No. Context decides: “that” may point to something already mentioned, or to something present in the situation.",q:"في الجملة That must have cost a lot of money، هل يمكن تحديد نوع الإحالة فورًا؟",a:"لا. السياق يحدد: قد تكون that تشير إلى شيء سبق ذكره أو إلى شيء موجود في الموقف."},

p:[["Endophoric references are further divided according to their direction.","تنقسم الإحالات endophoric بدورها بحسب اتجاهها."],["Endophora is divided into two types: anaphora and cataphora.","تنقسم endophora إلى نوعين: anaphora وcataphora."],["Anaphora refers to a presupposed element that has already been mentioned earlier in the text, whereas cataphora refers to an element that is introduced later in the discourse.","تشير anaphora إلى عنصر مفترَض سبق ذكره في النص، بينما تشير cataphora إلى عنصر يُقدَّم لاحقًا في الخطاب."],["Anaphoric reference occurs when a linguistic unit refers back to an earlier one (the antecedent on the left).","تحدث الإحالة anaphoric عندما تشير وحدة لغوية إلى وحدة سابقة (antecedent على اليسار)."],["It is a form of grammatical cohesion where a word or phrase points to information already mentioned or described previously.","وهي شكل من grammatical cohesion تشير فيه كلمة أو عبارة إلى معلومات سبق ذكرها أو وصفها."],["Consider the following example:","انظر المثال الآتي:"],["The man is living alone. His wife left him for 9 years.","الرجل يعيش وحده. زوجته تركته منذ 9 سنوات.",1],["In this sentence, “his” and “him” are examples of anaphoric reference, since they point back to “the man.”","في هذه الجملة، his وhim مثالان على الإحالة anaphoric لأنهما تشيران رجوعًا إلى the man."],["Without the presupposed clause “the man is living alone,” it would be unclear what “his” and “him” refer to.","ومن دون الجملة المفترَضة the man is living alone لن يكون واضحًا ما الذي تشير إليه his وhim."],["Because their meaning relies on looking back at the preceding sentence, they are classified as anaphoric.","ولأن معناهما يعتمد على النظر إلى الجملة السابقة، فهما تُصنَّفان anaphoric."]],
o:["Their antecedent comes before them","Their antecedent comes after them","They point outside the text","They replace a verb"],c:0,qe:"Why are “his” and “him” classified as anaphoric?",ae:"Because their meaning depends on looking back at the preceding sentence (“the man”): the antecedent comes before them.",q:"لماذا تُصنَّف his وhim على أنهما anaphoric؟",a:"لأن معناهما يعتمد على النظر إلى الجملة السابقة (the man)، أي أن antecedent يقع قبلهما.",after(){arcs()},arc:["c0",["c1","c2"]]},{path:"Reference › Endophoric › Cataphoric",tag:"Slide 16 · Direction",t:"Cataphora: pointing forward",ge:"Cataphora is anaphora reversed: the pointing word comes first, and we must read ahead to find what it means.",g:"cataphora هي عكس anaphora: الكلمة المُشيرة تأتي أولًا، ولا نعرف المقصود إلا بقراءة ما بعدها.",
fig:()=>`<div class="stage" id="st"><div class="chips"><span class="chip b" id="p1">He</span><span class="chip">’s a superstar,</span><span class="chip b" id="p2">he</span><span class="chip">’s the best in his era. Let’s welcome..</span><span class="chip g" id="t0">Justin Bieber.</span></div><svg id="sv"></svg></div><div class="det"><div class="en">“He” points forward to “Justin Bieber”: the antecedent is on the right.</div><div class="ar">he تشير إلى الأمام نحو Justin Bieber، أي إلى antecedent على اليمين.</div></div>`,
p:[["Cataphoric reference occurs when a linguistic unit refers forward to another that comes later in the text (the antecedent on the right).","تحدث الإحالة cataphoric عندما تشير وحدة لغوية إلى وحدة تأتي لاحقًا في النص (antecedent على اليمين)."],["It represents grammatical cohesion where a word or phrase anticipates information that will be introduced afterwards.","وهي تمثل grammatical cohesion تستبق فيها كلمة أو عبارة معلومات ستُقدَّم لاحقًا."],["Consider the following example:","انظر المثال الآتي:"],["He’s a superstar, he’s the best in his era. Let’s welcome.. Justin Bieber.","إنه نجم كبير، إنه الأفضل في عصره. لنرحّب بـ.. Justin Bieber.",1],["In this sentence, “he” functions as a cataphoric reference to the presupposed subject “Justin Bieber.”","في هذه الجملة، تؤدي he وظيفة إحالة cataphoric إلى الفاعل (subject) المفترَض Justin Bieber."],["To identify what “he” refers to, we must look ahead to the following sentence.","ولمعرفة ما تشير إليه he، يجب أن ننظر إلى الجملة التالية."]],
o:["The antecedent is outside the text","Cataphora points back, anaphora forward","There is no difference","The antecedent comes later, so you look ahead"],c:3,qe:"How is cataphora different from anaphora?",ae:"In cataphora the antecedent comes later (on the right), so you must look ahead; in anaphora it comes earlier (on the left).",q:"ما الفرق بين cataphora وanaphora؟",a:"في cataphora يأتي antecedent لاحقًا (على اليمين) فننظر إلى الأمام، وفي anaphora يأتي سابقًا (على اليسار).",after(){arcs()},arc:["t0",["p1","p2"]]},{path:"Reference › the whole map",tag:"Closing · ours",t:"Putting Reference together",ge:"One screen to hold it all: three questions that sort any example, then a final test.",g:"شاشة واحدة تجمع كل شيء: ثلاثة أسئلة تصنّف أي مثال، ثم اختبار أخير.",
fig:()=>`<div class="step"><b>1</b><div><div class="en">Which word points to something else for its meaning?</div><div class="ar">أي كلمة تعتمد على غيرها لتفسيرها؟ هذه هي deictic expression.</div></div></div><div class="step"><b>2</b><div><div class="en">Is what it points to in the text, or only in the situation?</div><div class="chips"><span class="chip g">inside the text → endophoric (<bdi dir="rtl" class="ai">داخل النص</bdi>)</span><span class="chip a">only in the situation → exophoric (<bdi dir="rtl" class="ai">في الموقف فقط</bdi>)</span></div></div></div><div class="step"><b>3</b><div><div class="en">If inside the text: does the antecedent come before it (left) or after it (right)?</div><div class="chips"><span class="chip g">before it → anaphoric (<bdi dir="rtl" class="ai">قبلها</bdi>)</span><span class="chip g">after it → cataphoric (<bdi dir="rtl" class="ai">بعدها</bdi>)</span></div></div></div>`,
p:[],x:`<details class="sec" open><summary><span>Compare <i>· ours, not the lecture’s</i></span><b class="chv"></b></summary><div class="sb"><table class="cmp"><tr><th>Type</th><th>Antecedent</th><th>Lecture example</th></tr><tr><td class="cg">anaphoric</td><td>inside the text, on the left</td><td>his, him → the man</td></tr><tr><td class="cg">cataphoric</td><td>inside the text, on the right</td><td>he → Justin Bieber</td></tr><tr><td class="ca">exophoric</td><td>outside the text, in the situation</td><td>“this” (second dress)</td></tr></table></div></details><details class="sec trap" open><summary><span>Exam trap</span><b class="chv"></b></summary><div class="sb">“that” is not automatically one type: in the fitting room, “that” is endophoric and “this” is exophoric. Context decides.<div class="ar">لا تحفظي الكلمة نفسها: السياق هو الذي يحدد النوع.</div></div></details><details class="sec exr" open><summary><span>Transfer exercise <i>· ours, not the lecture’s</i></span><b class="chv"></b></summary><div class="sb"><div class="en">Click each highlighted word. Predict first, then check: an arrow shows what it points to.</div><div class="stage" id="st2"><div class="chips"><span class="chip">Before</span><span class="chip b" id="e1" data-to="e2" data-k="blue" data-t="“she” points to Maya, who is named later: cataphoric (antecedent on the right).|she تشير إلى Maya المذكورة لاحقًا: cataphoric.">she</span><span class="chip">opened the box,</span><span class="chip" id="e2">Maya</span><span class="chip">read</span><span class="chip" id="e4">the label.</span><span class="chip g" id="e3" data-to="e4" data-k="grn" data-t="“It” points back to the label: anaphoric (antecedent on the left).|It تشير إلى the label السابقة: anaphoric.">It</span><span class="chip">said “fragile”. “Look at</span><span class="chip a" id="e5" data-to="w1" data-k="amb" data-t="“this” points to a box Omar is holding that the text never names: exophoric (situational), like the second dress.|this تشير إلى صندوق في الموقف لم يُذكر في النص: exophoric، مثل الفستان الثاني.">this</span><span class="chip">,” said Omar, holding up another box.</span></div><div class="chips world"><span class="chip w" id="w1">📦 another box in the room (not named in the text)</span></div><svg id="sv2"></svg></div><div class="det" id="tr"><div class="en">Click a highlighted word to check your answer.</div></div></div></details>`,
