button[aria-pressed=true]{background:var(--bs);transform:translateY(4px);box-shadow:none}

button:active:not(:disabled),.tree .n:active,.mp[data-go]:active,[data-t]:active{transform:translateY(4px);box-shadow:0 0 0 transparent!important}
nav{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:14px 0}nav .d{display:flex;gap:6px}nav .d i{width:9px;height:9px;border-radius:50%;background:var(--line)}nav .d i.on{background:var(--red);transform:scale(1.3)}

<script>
const L=s=>s.replace(/[A-Za-z0-9][A-Za-z0-9’'\-]*(?:[ \/→][A-Za-z0-9’'\-]+)*/g,w=>`<bdi dir="ltr" class="l">${w}</bdi>`);
const M=[
{path:"Lecture 4",tag:"Start here · Lecture map",t:"Lecture 4 · Grammatical Cohesion",ge:"The whole lecture on one screen. Solid boxes are in the lecture, the dashed box is not. Click a built part to jump to it.",g:"المحاضرة كلها في شاشة واحدة. الصناديق المتصلة من المحاضرة، والمتقطعة ليست منها. اضغطي على أي جزء جاهز للانتقال إليه.",
fig:()=>`<div class="map"><div class="mp root">Lecture 4 · Grammatical Cohesion<small>slides 1–38 · slides 1, 7 and 38 are title-only dividers · reference, substitution and ellipsis are types of grammatical cohesion (slide 8)</small></div><ul>
<li><div class="mp soon">1 · Cohesion basics<small>slides 2–9 · 6 concepts · 2 examples · coming next</small></div></li>
<li><div class="mp" data-go="1">2 · Reference<small>slides 10–17 · 7 concepts · 4 examples · built (slides 13–14 pending)</small></div><ul><li><div class="mp sub">endophoric</div><ul><li><div class="mp sub">anaphora</div></li><li><div class="mp sub">cataphora</div></li></ul></li><li><div class="mp sub">exophoric (situational)</div></li></ul></li>
<li><div class="mp soon">3 · Substitution<small>slides 18–26 · 4 concepts · 6 examples · coming next</small></div><ul><li><div class="mp sub">nominal: one, ones, same</div></li><li><div class="mp sub">verbal: do</div></li><li><div class="mp sub">clausal: so, not</div></li></ul></li>
<li><div class="mp soon">4 · Ellipsis<small>slides 27–37 · 5 concepts · 7 examples · coming next</small></div><ul><li><div class="mp sub">nominal ellipsis</div></li><li><div class="mp sub">verbal ellipsis</div></li></ul></li>
<li><div class="mp dot" data-go="6">Conjunction<small>named on slide 8 · not covered in this deck · our explanation, not from the lecture</small></div></li></ul></div>`,
p:[],qe:"Without looking: name the four parts of Lecture 4, and say which cohesive device this deck does not cover.",ae:"Cohesion basics, Reference, Substitution, Ellipsis. Conjunction is named on slide 8 but not covered here; lexical cohesion only gets an overview on slide 9.",q:"بدون النظر: اذكري أجزاء المحاضرة الأربعة، وأي cohesive device لا تغطيه هذه المحاضرة؟",a:"Cohesion basics وReference وSubstitution وEllipsis. أما conjunction فمذكور في الشريحة 8 ولا يُشرح هنا، وlexical cohesion له نظرة عامة فقط في الشريحة 9."},
{path:"Reference",tag:"Slide 11 · Core definition",t:"What is Reference?",ge:"Reference is a relationship: one item points, another is pointed to. Ask: what does this word point to?",g:"الإحالة (Reference) علاقة بين عنصر يشير وعنصر يُشار إليه: ما الذي تشير إليه هذه الكلمة؟",
fig:()=>`<div class="chips"><span class="chip b">deictic expression (deixis)</span><b>→</b><span class="chip g">antecedent</span></div><div class="det"><div class="en">The item that points is the deictic expression; the item it points to is the antecedent.</div><div class="ar">العنصر الذي يشير هو deictic expression، والعنصر الذي يشير إليه هو antecedent.</div></div>`,
p:[["Reference occurs when an item in a text depends on another element for its interpretation.","تحدث الإحالة (Reference) عندما يعتمد عنصر في النص على عنصر آخر لتفسيره."],["Reference is the relationship between a linguistic item and the element it refers to.","الإحالة هي العلاقة بين عنصر لغوي والعنصر الذي يشير إليه."],["The words that serve this function are called deictic expressions (deixis), while the elements they point to are known as antecedents.","تُسمّى الكلمات التي تؤدي هذه الوظيفة deictic expressions (deixis)، أما العناصر التي تشير إليها فتُعرف باسم antecedents."]],
qe:"What is the pointing item called, and what is the item it points to called?",ae:"The pointing item: deictic expression (deixis). The item pointed to: antecedent.",q:"ما اسم العنصر الذي يشير، وما اسم العنصر المُشار إليه؟",a:"الأول: deictic expression (deixis). والثاني: antecedent."},
{path:"Reference › Endophoric / Exophoric",tag:"Slides 12 + 17 · Two types",t:"Endophoric & Exophoric",ge:"First question, always: is the thing referred to inside the text (endophoric) or outside it, in the situation (exophoric)?",g:"السؤال الأول دائمًا: هل المرجع داخل النص (endophoric) أم خارجه في الموقف (exophoric)؟",
fig:()=>`<button id="xt" aria-pressed="false">Exam focus (hide dotted)</button> <div class="tree"><div class="n" data-d="Reference: أي عنصر يعتمد على عنصر آخر لتفسيره.">Reference</div><ul><li><div class="n a" data-d="exophora (situational): المرجع خارج الخطاب، في السياق الموقفي.">exophora (situational)</div><ul class="x"><li><div class="n x" data-d="homophoric: المرجع يُعرف من المعرفة الثقافية المشتركة مثل the moon. امتداد معروف، وليس من المحاضرة.">homophoric (shared cultural knowledge)</div></li></ul></li><li><div class="n g" data-d="endophora (textual): المرجع داخل الخطاب نفسه.">endophora (textual)</div><ul><li><div class="n g" data-d="anaphora (to preceding text): تشير إلى النص السابق.">anaphora (to preceding text)</div></li><li><div class="n g" data-d="cataphora (to following text): تشير إلى النص اللاحق.">cataphora (to following text)</div></li></ul></li></ul><div class="xl">┈┈ related, not a type of Reference</div><div class="n x" data-d="نصوص أخرى: الاستشهادات والروابط التشعبية تربط نصًّا بنصوص أخرى، لكنها ليست نوعًا من Reference.">other texts: citations, hyperlinks</div></div><div class="det" id="det"><div class="en">Click any item in the tree.</div><div class="ar">اضغطي على أي عنصر في الشجرة.</div></div>`,
p:[["Reference can be of two types: exophoric, when it refers to something outside the discourse (in the situational context), and endophoric, when it refers to something within the discourse itself.","للإحالة نوعان: exophoric عندما تشير إلى شيء خارج الخطاب (في السياق الموقفي situational context)، وendophoric عندما تشير إلى شيء داخل الخطاب نفسه."],["Some items in a language do not carry meaning fully on their own but instead point to something else for their interpretation.","بعض عناصر اللغة لا تحمل معناها كاملًا بمفردها، بل تشير إلى شيء آخر لتفسيرها."],["These items in English are usually pronouns, demonstratives, and comparatives.","وهذه العناصر في الإنجليزية هي عادةً pronouns (الضمائر) وdemonstratives (أسماء الإشارة) وcomparatives (أدوات المقارنة)."],["In grammar, reference is a type of coherence in which one linguistic element points to another.","في النحو، الإحالة نوع من coherence يشير فيه عنصر لغوي إلى عنصر آخر."],["If it refers to something outside the text, it is considered exophoric.","فإذا أشارت إلى شيء خارج النص عُدّت exophoric."],["Consider the following example:","انظر المثال الآتي:"],["That must have cost a lot of money.","لا بد أن ذلك كلّف الكثير من المال.",1]],
x:`<div class="trap"><b>OUR NOTE</b> · Slide 12 says reference is “a type of coherence”. Slides 4 and 8 place Reference under cohesion (grammatical cohesion), so “coherence” may be a slip. Keep the slide’s wording in mind in case it is asked, and check with your lecturer.<div class="ar">الشريحة 12 تقول coherence، بينما الشريحتان 4 و8 تضعان Reference تحت cohesion. احتفظي بصياغة الشريحة وتأكدي من المحاضر.</div></div>`,
qe:"In “That must have cost a lot of money,” can you tell the type of reference immediately?",ae:"No. Context decides: “that” may point to something already mentioned, or to something present in the situation.",q:"في الجملة That must have cost a lot of money، هل يمكن تحديد نوع الإحالة فورًا؟",a:"لا. السياق يحدد: قد تكون that تشير إلى شيء سبق ذكره أو إلى شيء موجود في الموقف."},
{path:"Reference › Endophoric › Anaphoric",tag:"Slide 15 · Direction",t:"Anaphora: pointing back",ge:"Endophoric reference has a direction: anaphora points back to what came before; cataphora points forward to what comes next.",g:"الإحالة endophoric لها اتجاه: anaphora ترجع إلى ما سبق، وcataphora تتطلع إلى ما سيأتي.",
fig:()=>`<div class="stage" id="st"><div class="chips"><span class="chip g" id="c0">The man</span><span class="chip">is living alone.</span><span class="chip b" id="c1">His</span><span class="chip">wife left</span><span class="chip b" id="c2">him</span><span class="chip">for 9 years.</span></div><svg id="sv"></svg></div><div class="det"><div class="en">“His” and “him” point back to “the man”: the antecedent is on the left.</div><div class="ar">his وhim تشيران رجوعًا إلى the man، أي إلى antecedent على اليسار.</div></div>`,
p:[["Endophoric references are further divided according to their direction.","تنقسم الإحالات endophoric بدورها بحسب اتجاهها."],["Endophora is divided into two types: anaphora and cataphora.","تنقسم endophora إلى نوعين: anaphora وcataphora."],["Anaphora refers to a presupposed element that has already been mentioned earlier in the text, whereas cataphora refers to an element that is introduced later in the discourse.","تشير anaphora إلى عنصر مفترَض سبق ذكره في النص، بينما تشير cataphora إلى عنصر يُقدَّم لاحقًا في الخطاب."],["Anaphoric reference occurs when a linguistic unit refers back to an earlier one (the antecedent on the left).","تحدث الإحالة anaphoric عندما تشير وحدة لغوية إلى وحدة سابقة (antecedent على اليسار)."],["It is a form of grammatical cohesion where a word or phrase points to information already mentioned or described previously.","وهي شكل من grammatical cohesion تشير فيه كلمة أو عبارة إلى معلومات سبق ذكرها أو وصفها."],["Consider the following example:","انظر المثال الآتي:"],["The man is living alone. His wife left him for 9 years.","الرجل يعيش وحده. زوجته تركته منذ 9 سنوات.",1],["In this sentence, “his” and “him” are examples of anaphoric reference, since they point back to “the man.”","في هذه الجملة، his وhim مثالان على الإحالة anaphoric لأنهما تشيران رجوعًا إلى the man."],["Without the presupposed clause “the man is living alone,” it would be unclear what “his” and “him” refer to.","ومن دون الجملة المفترَضة the man is living alone لن يكون واضحًا ما الذي تشير إليه his وhim."],["Because their meaning relies on looking back at the preceding sentence, they are classified as anaphoric.","ولأن معناهما يعتمد على النظر إلى الجملة السابقة، فهما تُصنَّفان anaphoric."]],
qe:"Why are “his” and “him” classified as anaphoric?",ae:"Because their meaning depends on looking back at the preceding sentence (“the man”): the antecedent comes before them.",q:"لماذا تُصنَّف his وhim على أنهما anaphoric؟",a:"لأن معناهما يعتمد على النظر إلى الجملة السابقة (the man)، أي أن antecedent يقع قبلهما.",after(){arcs()},arc:["c0",["c1","c2"]]},{path:"Reference › Endophoric › Cataphoric",tag:"Slide 16 · Direction",t:"Cataphora: pointing forward",ge:"Cataphora is anaphora reversed: the pointing word comes first, and we must read ahead to find what it means.",g:"cataphora هي عكس anaphora: الكلمة المُشيرة تأتي أولًا، ولا نعرف المقصود إلا بقراءة ما بعدها.",
fig:()=>`<div class="stage" id="st"><div class="chips"><span class="chip b" id="p1">He</span><span class="chip">’s a superstar,</span><span class="chip b" id="p2">he</span><span class="chip">’s the best in his era. Let’s welcome..</span><span class="chip g" id="t0">Justin Bieber.</span></div><svg id="sv"></svg></div><div class="det"><div class="en">“He” points forward to “Justin Bieber”: the antecedent is on the right.</div><div class="ar">he تشير إلى الأمام نحو Justin Bieber، أي إلى antecedent على اليمين.</div></div>`,
p:[["Cataphoric reference occurs when a linguistic unit refers forward to another that comes later in the text (the antecedent on the right).","تحدث الإحالة cataphoric عندما تشير وحدة لغوية إلى وحدة تأتي لاحقًا في النص (antecedent على اليمين)."],["It represents grammatical cohesion where a word or phrase anticipates information that will be introduced afterwards.","وهي تمثل grammatical cohesion تستبق فيها كلمة أو عبارة معلومات ستُقدَّم لاحقًا."],["Consider the following example:","انظر المثال الآتي:"],["He’s a superstar, he’s the best in his era. Let’s welcome.. Justin Bieber.","إنه نجم كبير، إنه الأفضل في عصره. لنرحّب بـ.. Justin Bieber.",1],["In this sentence, “he” functions as a cataphoric reference to the presupposed subject “Justin Bieber.”","في هذه الجملة، تؤدي he وظيفة إحالة cataphoric إلى الفاعل (subject) المفترَض Justin Bieber."],["To identify what “he” refers to, we must look ahead to the following sentence.","ولمعرفة ما تشير إليه he، يجب أن ننظر إلى الجملة التالية."]],
qe:"How is cataphora different from anaphora?",ae:"In cataphora the antecedent comes later (on the right), so you must look ahead; in anaphora it comes earlier (on the left).",q:"ما الفرق بين cataphora وanaphora؟",a:"في cataphora يأتي antecedent لاحقًا (على اليمين) فننظر إلى الأمام، وفي anaphora يأتي سابقًا (على اليسار).",after(){arcs()},arc:["t0",["p1","p2"]]},{path:"Reference › the whole map",tag:"Closing · Synthesis (ours)",t:"Putting Reference together",ge:"One screen to hold it all: three questions that sort any example, then a final test.",g:"شاشة واحدة تجمع كل شيء: ثلاثة أسئلة تصنّف أي مثال، ثم اختبار أخير.",
fig:()=>`<div class="step"><b>1</b><div><div class="en">Which word points to something else for its meaning?</div><div class="ar">أي كلمة تعتمد على غيرها لتفسيرها؟ هذه هي deictic expression.</div></div></div><div class="step"><b>2</b><div><div class="en">Is what it points to in the text, or only in the situation?</div><div class="ar">داخل النص: endophoric. في الموقف فقط: exophoric.</div></div></div><div class="step"><b>3</b><div><div class="en">If inside the text: does the antecedent come before it (left) or after it (right)?</div><div class="ar">قبلها: anaphoric. بعدها: cataphoric.</div></div></div>`,
p:[],x:`<section class="sec"><div class="sh">Compare <i>· ours, not the lecture’s</i></div><table class="cmp"><tr><th>Type</th><th>Antecedent</th><th>Lecture example</th></tr><tr><td>anaphoric</td><td>inside the text, on the left</td><td>his, him → the man</td></tr><tr><td>cataphoric</td><td>inside the text, on the right</td><td>he → Justin Bieber</td></tr><tr><td>exophoric</td><td>outside the text, in the situation</td><td>“this” (second dress)</td></tr></table></section><div class="trap"><b>EXAM TRAP</b> · “that” is not automatically one type: in the fitting room, “that” is endophoric and “this” is exophoric. Context decides.<div class="ar">لا تحفظي الكلمة نفسها: السياق هو الذي يحدد النوع.</div></div><section class="sec exr"><div class="sh">Transfer exercise <i>· ours, not the lecture’s</i></div><div class="en" style="margin-bottom:6px">Click each highlighted word. Predict first, then check: an arrow shows what it points to.</div><div class="stage" id="st2"><div class="chips"><span class="chip">Before</span><span class="chip b" id="e1" data-to="e2" data-k="blue" data-t="“she” points to Maya, who is named later: cataphoric (antecedent on the right).|she تشير إلى Maya المذكورة لاحقًا: cataphoric.">she</span><span class="chip">opened the box,</span><span class="chip" id="e2">Maya</span><span class="chip">read</span><span class="chip" id="e4">the label.</span><span class="chip g" id="e3" data-to="e4" data-k="grn" data-t="“It” points back to the label: anaphoric (antecedent on the left).|It تشير إلى the label السابقة: anaphoric.">It</span><span class="chip">said “fragile”. “Look at</span><span class="chip a" id="e5" data-to="w1" data-k="amb" data-t="“this” points to a box Omar is holding that the text never names: exophoric (situational), like the second dress.|this تشير إلى صندوق في الموقف لم يُذكر في النص: exophoric، مثل الفستان الثاني.">this</span><span class="chip">,” said Omar, holding up another box.</span></div><div class="chips" style="margin-top:46px"><span class="chip" id="w1" style="border-style:dashed;color:var(--mut)">📦 another box in the room (not named in the text)</span></div><svg id="sv2"></svg></div><div class="det" id="tr"><div class="en">Click a highlighted word to check your answer.</div></div></section>`,
qe:"Say it back: without looking, draw the Reference tree and explain how you decide between the types.",ae:"Reference is either exophoric (outside the text, situational) or endophoric (inside the text). Endophoric splits into anaphoric (antecedent on the left, refers back) and cataphoric (antecedent on the right, refers forward).",q:"قولي بصوتك: ارسمي شجرة Reference من الذاكرة واشرحي كيف تقررين بين الأنواع.",a:"Reference: إما exophoric (خارج النص، في الموقف) أو endophoric (داخل النص). وendophoric ينقسم إلى anaphoric (antecedent على اليسار) وcataphoric (antecedent على اليمين)."},{path:"Cohesion › Grammatical › Conjunction",tag:"NOT FROM THIS LECTURE · ours",t:"Conjunction",ge:"Conjunction links sentences by meaning: the connector tells you how the next sentence relates to the one before.",g:"conjunction تربط الجمل بحسب المعنى: كلمة الربط تخبرك كيف ترتبط الجملة التالية بالسابقة.",
fig:()=>`<div class="step"><b>＋</b><div><div class="en">additive: and, also, in addition</div><div class="ar">إضافة</div></div></div><div class="step"><b>≠</b><div><div class="en">adversative: but, however, yet</div><div class="ar">تعارض</div></div></div><div class="step"><b>⇒</b><div><div class="en">causal: so, because, therefore</div><div class="ar">سبب ونتيجة</div></div></div><div class="step"><b>→</b><div><div class="en">temporal: then, next, finally</div><div class="ar">ترتيب زمني</div></div></div>`,
